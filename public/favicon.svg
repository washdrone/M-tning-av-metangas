<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="g" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <g stroke="url(#g)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- top-left arm -->
    <line x1="22" y1="22" x2="10" y2="10"/>
    <!-- top-right arm -->
    <line x1="42" y1="22" x2="54" y2="10"/>
    <!-- bottom-left arm -->
    <line x1="22" y1="42" x2="10" y2="54"/>
    <!-- bottom-right arm -->
    <line x1="42" y1="42" x2="54" y2="54"/>
    <!-- center body -->
    <rect x="20" y="20" width="24" height="24" rx="4"/>
    <!-- inner square (cutout look) -->
    <rect x="27" y="27" width="10" height="10" rx="1" fill="white" stroke="none"/>
  </g>
</svg>
